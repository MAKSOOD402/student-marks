trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# =========================
# React UI
# =========================

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  workingDirectory: student-marks-react
  displayName: 'Build React UI'


# =========================
# .NET 10 API
# =========================

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.x'
  displayName: 'Install .NET 10 SDK'

- script: |
    dotnet restore
  workingDirectory: StudentMarksApi
  displayName: 'Restore ASP.NET API'

- script: |
    dotnet build --configuration Release --no-restore
  workingDirectory: StudentMarksApi
  displayName: 'Build ASP.NET API'

- script: |
    dotnet test --configuration Release --no-build
  workingDirectory: StudentMarksApi
  displayName: 'Test ASP.NET API'

- script: |
    dotnet publish StudentMarksApi.csproj \
      --configuration Release \
      --output $(Build.ArtifactStagingDirectory)/api
  workingDirectory: StudentMarksApi
  displayName: 'Publish ASP.NET API'


# =========================
# Enable ASP.NET startup logging
# =========================

- pwsh: |
    $path = "$(Build.ArtifactStagingDirectory)/api/web.config"

    $content = Get-Content $path -Raw

    $content = $content -replace 'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"'

    $content = $content -replace 'stdoutLogFile="[^"]*"', 'stdoutLogFile="\\?\%home%\LogFiles\stdout"'

    Set-Content -Path $path -Value $content

    Write-Host "Updated web.config:"
    Get-Content $path
  displayName: 'Enable ASP.NET startup logging'


# =========================
# Create deployment ZIP
# =========================

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/StudentMarksApi.zip'
    replaceExistingArchive: true
  displayName: 'Archive ASP.NET API'


# =========================
# Deploy API to Azure App Service
# =========================

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'StudentMarks-Azure'
    appType: 'webApp'
    appName: 'studentmarks-api'
    resourceGroupName: 'studentmarks-rg'
    package: '$(Build.ArtifactStagingDirectory)/StudentMarksApi.zip'
  displayName: 'Deploy ASP.NET API to Azure'
